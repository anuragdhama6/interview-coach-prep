<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Java Interview Coach</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#060b14;--surf:#0f172a;--surf2:#1a1f2e;
    --brd:#1e293b;--brd2:#334155;
    --txt:#e2e8f0;--txt2:#94a3b8;--txt3:#64748b;
    --acc:#3b82f6;--acc2:#1d4ed8;
  }
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .header{background:#0a0f1e;border-bottom:1px solid var(--brd);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .header-logo{font-size:24px}
  .header-title{font-size:15px;font-weight:700;color:#f1f5f9}
  .header-sub{font-size:11px;color:var(--txt3);margin-top:1px}
  .badge{background:#22c55e20;color:#4ade80;border:1px solid #22c55e44;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px;margin-left:auto}
  .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:blink 1.5s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .quick-bar{background:#0a0f1e;border-bottom:1px solid var(--brd);padding:8px 16px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0}
  .quick-bar::-webkit-scrollbar{display:none}
  .qbtn{background:var(--surf);border:1px solid var(--brd);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--txt2);cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
  .qbtn:hover{border-color:var(--acc);color:#60a5fa;background:var(--surf2)}
  .messages{flex:1;overflow-y:auto;padding:24px 16px;scroll-behavior:smooth}
  .messages::-webkit-scrollbar{width:4px}
  .messages::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px}
  .msg-row{display:flex;gap:10px;margin-bottom:18px;align-items:flex-start;max-width:860px;margin-left:auto;margin-right:auto;width:100%}
  .msg-row.user{flex-direction:row-reverse}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .avatar.bot{background:var(--surf2);border:1px solid var(--brd2)}
  .avatar.user{background:var(--acc)}
  .bubble{max-width:80%;padding:12px 16px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .bubble.bot{background:var(--surf);border:1px solid var(--brd);border-radius:4px 18px 18px 18px;color:var(--txt)}
  .bubble.user{background:var(--acc2);border-radius:18px 4px 18px 18px;color:#fff}
  .welcome{background:var(--surf);border:1px solid var(--brd);border-radius:16px;padding:24px;max-width:580px}
  .welcome h2{font-size:19px;font-weight:700;color:#f1f5f9;margin-bottom:8px}
  .welcome p{font-size:13px;color:var(--txt3);line-height:1.7;margin-bottom:18px}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mode-chip{background:#0a0f1e;border:1px solid var(--brd);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .15s;text-align:left;font-family:inherit}
  .mode-chip:hover{border-color:var(--acc);background:var(--surf2)}
  .mode-chip-icon{font-size:18px;margin-bottom:4px}
  .mode-chip-label{font-size:12px;font-weight:600;color:#f1f5f9}
  .mode-chip-desc{font-size:11px;color:var(--txt3);margin-top:2px;line-height:1.4}
  .score-card{background:var(--surf);border-radius:12px;padding:14px 18px;margin-top:8px;max-width:500px;width:100%}
  .score-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .score-num{font-size:26px;font-weight:700;font-family:monospace}
  .score-bar-bg{flex:1;height:6px;background:var(--brd2);border-radius:3px;overflow:hidden}
  .score-bar{height:100%;border-radius:3px}
  .score-label{font-size:11px;color:var(--txt2)}
  .score-fb{font-size:13px;color:#cbd5e1;line-height:1.6}
  .score-follow{font-size:13px;color:#7dd3fc;margin-top:8px;padding-top:8px;border-top:1px solid var(--brd)}
  .typing{display:flex;gap:5px;padding:14px 18px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pulse 1.2s ease-in-out infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .input-area{background:#0a0f1e;border-top:1px solid var(--brd);padding:12px 16px;flex-shrink:0}
  .input-inner{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:12px 16px;color:var(--txt);font-size:14px;font-family:inherit;resize:none;outline:none;line-height:1.6;transition:border-color .15s;max-height:140px}
  textarea:focus{border-color:var(--acc)}
  textarea::placeholder{color:var(--txt3)}
  .send-btn{width:44px;height:44px;background:var(--acc);border:none;border-radius:12px;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
  .send-btn:disabled{background:var(--brd);color:var(--txt3);cursor:default}
  .send-btn:not(:disabled):hover{background:#2563eb}
  .input-hint{max-width:860px;margin:6px auto 0;font-size:11px;color:var(--txt3);text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">☕</div>
  <div>
    <div class="header-title">Java Interview Coach</div>
    <div class="header-sub">Senior · Java · Spring Boot · Microservices</div>
  </div>
  <div class="badge"><div class="dot"></div>Free · No signup</div>
</div>

<div class="quick-bar">
  <button class="qbtn" onclick="qs('Start a mock interview')">🎯 Mock Interview</button>
  <button class="qbtn" onclick="qs('Give me a medium Java coding challenge')">💻 Coding Challenge</button>
  <button class="qbtn" onclick="qs('Profile me for a senior Java interview')">👤 Profile Me</button>
  <button class="qbtn" onclick="qs('Explain @Transactional pitfalls in Spring Boot')">@Transactional</button>
  <button class="qbtn" onclick="qs('Explain Virtual Threads in Java 21')">Virtual Threads</button>
  <button class="qbtn" onclick="qs('Explain Circuit Breaker pattern with Resilience4j')">Circuit Breaker</button>
  <button class="qbtn" onclick="qs('Explain the N+1 query problem in JPA')">N+1 Problem</button>
  <button class="qbtn" onclick="qs('Start a tradeoff debate: Kafka vs REST')">⚖️ Tradeoff</button>
  <button class="qbtn" onclick="qs('I want to do a code review')">🔬 Code Review</button>
  <button class="qbtn" onclick="qs('Explain SAGA pattern vs 2PC')">SAGA vs 2PC</button>
  <button class="qbtn" onclick="qs('Explain G1 vs ZGC garbage collectors')">G1 vs ZGC</button>
  <button class="qbtn" onclick="qs('What can you help me with?')">❓ Help</button>
</div>

<div class="messages" id="messages"></div>

<div class="input-area">
  <div class="input-inner">
    <textarea id="inp" rows="1" placeholder="Ask anything — Java, Spring Boot, Microservices, coding challenges..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendFromInput()" disabled>↑</button>
  </div>
  <div class="input-hint">Enter to send · Shift+Enter for new line · Free · No login required</div>
</div>

<script>
const SYSTEM = `You are a senior Java/Spring Boot/Microservices engineer and technical interview coach. You help lateral joiners prepare for client interviews. Direct, production-focused, no fluff.

## Dual Role
1. INTERVIEW PREP COACH — mock interviews, coding challenges, concept explanations, code reviews, tradeoff debates
2. HELP BOT — guide users to the right prep activity, explain what you can do

## Available Modes
🎯 Mock Interview — score every answer 1-5 with feedback and follow-up probe
💻 Coding Challenge — Easy/Medium/Hard, evaluated on 8 dimensions
👤 Profile Me — 5 questions then level + gap analysis + study plan
🔍 Concept Deep-Dive — 3-layer explanation + trap question + production gotcha
🔬 Code Review — senior engineer PR-style review
⚖️ Tradeoff Debate — argue architecture decisions

## MOCK INTERVIEW
One question at a time, progressively harder. After every answer output EXACTLY this JSON on its own line:
{"type":"score","score":3,"max":5,"topic":"Spring Transactions","category":"Spring Boot","feedback":"Good on basics but missed self-invocation proxy trap.","followup":"What happens when @Transactional calls another method in same class?"}

Question bank:
JAVA: HashMap internals + treeification, happens-before JMM, synchronized vs ReentrantLock, virtual threads Java 21, CompletableFuture.allOf with exceptions, double-checked locking without volatile
SPRING: @Transactional full proxy flow, REQUIRED vs REQUIRES_NEW propagation, Spring Security filter chain, EAGER fetch N+1, auto-configuration conditionals
MICROSERVICES: Resilience4j 3 states, Outbox pattern vs direct Kafka publish, SAGA choreography vs orchestration, Kafka consumer groups, connection pool exhaustion debugging

## CODING CHALLENGE
After user submits solution output EXACTLY this JSON on its own line:
{"type":"codeeval","difficulty":"Medium","topic":"Collections & Streams","overallScore":72,"dimensions":{"correctness":{"score":8,"max":10,"feedback":"Correct but misses null input"},"testCoverage":{"score":6,"max":10,"feedback":"No test for empty list or null"},"codeQuality":{"score":7,"max":10,"feedback":"Methods too long — violates SRP"},"solidPrinciples":{"score":6,"max":10,"feedback":"SRP violated — method does too much"},"designPatterns":{"score":5,"max":10,"feedback":"Use Strategy pattern instead of if-else"},"edgeCases":{"score":4,"max":10,"feedback":"Missing: null, empty, overflow, concurrent"},"timeComplexity":{"score":8,"max":10,"feedback":"O(n log n) — optimal"},"javaIdiomatic":{"score":7,"max":10,"feedback":"Use streams instead of manual loop"}},"idealSolution":"// Clean solution with comments here","nextChallenge":"Thread-safe version for concurrent access"}

Challenge bank:
EASY: Reverse string without reverse(), find duplicates with streams, FizzBuzz with IntStream, word frequency with Map, stack using two queues
MEDIUM: Thread-safe LRU cache using LinkedHashMap, retry with CompletableFuture backoff, immutable class with mutable field, Observer event bus, longest substring without repeating characters
HARD: Connection pool with thread safety and timeout, rate limiter token bucket thread-safe, mini DI container using reflection, distributed cache with TTL using ConcurrentHashMap

## PROFILER
Ask 5 questions ONE AT A TIME. After all 5 answers output EXACTLY this JSON on its own line:
{"type":"profile","level":"Senior","gaps":["Virtual threads","SAGA pattern","Distributed tracing"],"plan":"Week 1: Java 17-21 + Concurrency. Week 2: Spring transactions + Security. Week 3: Microservices resilience.","readiness":42}

## CONCEPT DEEP-DIVE
Structure: WHAT IT IS → HOW IT WORKS INTERNALLY → WHEN TO USE IT → TRAP QUESTION → PRODUCTION GOTCHA → FOLLOW-UP PROBE

## CODE REVIEW
Review: transaction boundaries, thread safety, N+1, resilience, security, SOLID violations. Rewrite bad section. Show PR comments.
Output EXACTLY this JSON on its own line: {"type":"codereview","score":6,"max":10,"issues":["Missing @Transactional","N+1 on getOrders()","No null check"]}

## TRADEOFF DEBATE
Present scenario. After user argues, challenge from other side. Score reasoning 1-5.
Topics: Kafka vs RabbitMQ, Feign vs WebClient, REST vs gRPC, SAGA choreography vs orchestration, Redis vs Caffeine, monolith vs microservices, JWT vs session auth

## RULES
- Never give definitions without production context
- Never accept vague — ask depends on what exactly?
- Always follow up after any answer
- For coding always show the ideal solution after evaluation
- Keep responses punchy — no filler`;

let history = [];
let busy    = false;

function renderWelcome() {
  const modes = [
    {icon:"🎯",label:"Mock Interview",   desc:"Scored interview simulation",      cmd:"Start a mock interview"},
    {icon:"💻",label:"Coding Challenge", desc:"8-dimension code evaluation",      cmd:"Give me a medium Java coding challenge"},
    {icon:"👤",label:"Profile Me",       desc:"Gap analysis + study plan",        cmd:"Profile me for a senior Java interview"},
    {icon:"🔍",label:"Concept Deep-Dive",desc:"3-layer + production gotchas",     cmd:"Explain @Transactional pitfalls in depth"},
    {icon:"🔬",label:"Code Review",      desc:"Senior engineer PR-style review",  cmd:"I want to do a code review"},
    {icon:"⚖️",label:"Tradeoff Debate", desc:"Argue architecture decisions",     cmd:"Start a tradeoff debate"},
  ];
  const row = document.createElement("div");
  row.className = "msg-row";
  row.innerHTML = `
    <div class="avatar bot">☕</div>
    <div style="flex:1;max-width:600px">
      <div class="welcome">
        <h2>👋 Java Interview Coach</h2>
        <p>Senior-level prep for Java · Spring Boot · Microservices.<br>
        Free, no login, no signup — just start chatting.<br>
        What would you like to do today?</p>
        <div class="mode-grid">
          ${modes.map(m=>`
            <button class="mode-chip" onclick="qs('${m.cmd}')">
              <div class="mode-chip-icon">${m.icon}</div>
              <div class="mode-chip-label">${m.label}</div>
              <div class="mode-chip-desc">${m.desc}</div>
            </button>`).join("")}
        </div>
      </div>
    </div>`;
  document.getElementById("messages").appendChild(row);
  scrollBottom();
}

function appendMsg(role, content) {
  const wrap = document.getElementById("messages");
  const row  = document.createElement("div");
  row.className = `msg-row ${role}`;

  let text = content;
  let scoreData=null, profileData=null, codeEvalData=null, reviewData=null;

  if (role === "bot") {
    const tryParse = (rx) => {
      const m = text.match(rx);
      if (m) { try { const d=JSON.parse(m[0]); text=text.replace(m[0],"").trim(); return d; } catch{} }
      return null;
    };
    codeEvalData = tryParse(/\{"type":"codeeval"[\s\S]*?\}(?=\s|$)/);
    scoreData    = tryParse(/\{"type":"score"[\s\S]*?\}(?=\s|$)/);
    profileData  = tryParse(/\{"type":"profile"[\s\S]*?\}(?=\s|$)/);
    reviewData   = tryParse(/\{"type":"codereview"[\s\S]*?\}(?=\s|$)/);
    if (reviewData && !scoreData) scoreData={score:reviewData.score,max:reviewData.max,feedback:(reviewData.issues||[]).join(" · "),followup:null};
  }

  const avatar = `<div class="avatar ${role}">${role==="bot"?"☕":"👤"}</div>`;
  const bubble = text ? `<div class="bubble ${role}">${esc(text)}</div>` : "";
  let extras   = "";

  if (scoreData) {
    const pct=(scoreData.score/scoreData.max)*100;
    const col=pct>=80?"#22c55e":pct>=60?"#f59e0b":"#ef4444";
    const lbl=pct>=80?"Strong":pct>=60?"Decent":"Needs work";
    extras+=`<div class="score-card" style="border:1px solid ${col}33">
      <div class="score-row">
        <span class="score-num" style="color:${col}">${scoreData.score}/${scoreData.max}</span>
        <div class="score-bar-bg"><div class="score-bar" style="width:${pct}%;background:${col}"></div></div>
        <span class="score-label">${lbl}</span>
      </div>
      <div class="score-fb">${esc(scoreData.feedback||"")}</div>
      ${scoreData.followup?`<div class="score-follow">↳ ${esc(scoreData.followup)}</div>`:""}
    </div>`;
  }

  if (codeEvalData) {
    const ov=codeEvalData.overallScore||0;
    const oc=ov>=80?"#22c55e":ov>=60?"#f59e0b":"#ef4444";
    const ol=ov>=80?"Excellent":ov>=60?"Good":ov>=40?"Needs Work":"Rewrite Needed";
    const dims={correctness:"✓ Correctness",testCoverage:"🧪 Test Coverage",codeQuality:"✨ Code Quality",solidPrinciples:"🏗 SOLID",designPatterns:"🔷 Design Patterns",edgeCases:"⚡ Edge Cases",timeComplexity:"⏱ Complexity",javaIdiomatic:"☕ Java Idiomatic"};
    const drows=Object.entries(dims).map(([k,label])=>{
      const d=codeEvalData.dimensions?.[k]; if(!d) return "";
      const p=(d.score/d.max)*100; const c=p>=80?"#22c55e":p>=60?"#f59e0b":"#ef4444";
      return `<div style="margin-bottom:9px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
          <span style="font-size:12px;color:#94a3b8;flex:1">${label}</span>
          <span style="font-size:12px;font-weight:600;color:${c}">${d.score}/${d.max}</span>
        </div>
        <div style="height:5px;background:#1e293b;border-radius:3px;overflow:hidden">
          <div style="width:${p}%;height:100%;background:${c};border-radius:3px"></div>
        </div>
        <div style="font-size:11px;color:#64748b;margin-top:3px;line-height:1.5">${esc(d.feedback||"")}</div>
      </div>`;
    }).join("");
    const r=26,circ=2*Math.PI*r;
    extras+=`<div style="background:#0f172a;border:1px solid ${oc}44;border-radius:14px;overflow:hidden;margin-top:8px;max-width:520px;width:100%">
      <div style="padding:16px 20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:16px">
        <div style="position:relative;width:64px;height:64px;flex-shrink:0">
          <svg viewBox="0 0 64 64" width="64" height="64" style="transform:rotate(-90deg)">
            <circle cx="32" cy="32" r="${r}" fill="none" stroke="#1e293b" stroke-width="7"/>
            <circle cx="32" cy="32" r="${r}" fill="none" stroke="${oc}" stroke-width="7"
              stroke-dasharray="${circ*ov/100} ${circ}" stroke-linecap="round"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:${oc}">${ov}</div>
        </div>
        <div>
          <div style="font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:6px">${ol}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${codeEvalData.difficulty?`<span style="background:#f59e0b20;color:#fbbf24;border:1px solid #f59e0b44;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600">${codeEvalData.difficulty}</span>`:""}
            ${codeEvalData.topic?`<span style="background:#a855f720;color:#c084fc;padding:2px 10px;border-radius:20px;font-size:11px">${esc(codeEvalData.topic)}</span>`:""}
          </div>
        </div>
      </div>
      <div style="padding:16px 20px">${drows}</div>
      ${codeEvalData.idealSolution?`<div style="border-top:1px solid #1e293b;padding:14px 20px"><div style="font-size:12px;color:#4ade80;margin-bottom:8px;font-weight:600">✓ Ideal Solution</div><pre style="font-size:12px;color:#94a3b8;overflow-x:auto;line-height:1.6;white-space:pre-wrap;background:#060b14;padding:12px;border-radius:8px">${esc(codeEvalData.idealSolution)}</pre></div>`:""}
      ${codeEvalData.nextChallenge?`<div style="border-top:1px solid #1e293b;padding:10px 20px;background:#0a0f1e"><span style="font-size:12px;color:#475569">Next: </span><span style="font-size:12px;color:#7dd3fc">${esc(codeEvalData.nextChallenge)}</span></div>`:""}
    </div>`;
  }

  if (profileData) {
    const gaps=(profileData.gaps||[]).map(g=>`<span style="background:#ef444420;color:#fca5a5;padding:2px 10px;border-radius:20px;font-size:12px">${esc(g)}</span>`).join(" ");
    const plan=(profileData.plan||"").split(". ").filter(Boolean).map(l=>`<div style="display:flex;gap:8px;margin-bottom:4px"><span style="color:#3b82f6;flex-shrink:0">▸</span><span style="font-size:13px;color:#cbd5e1">${esc(l)}</span></div>`).join("");
    extras+=`<div style="background:#1a1f2e;border:1px solid #3b82f633;border-radius:12px;padding:16px 20px;margin-top:8px;max-width:500px;width:100%">
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
        <span style="background:#3b82f620;color:#60a5fa;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:600">${esc(profileData.level||"")}</span>
        <span style="background:#22c55e20;color:#4ade80;padding:3px 12px;border-radius:20px;font-size:13px">Readiness: ${profileData.readiness||0}%</span>
      </div>
      <div style="font-size:11px;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">Identified Gaps</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${gaps}</div>
      <div style="font-size:11px;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">Study Plan</div>
      ${plan}
    </div>`;
  }

  const inner=`<div style="display:flex;flex-direction:column;align-items:${role==="user"?"flex-end":"flex-start"};max-width:82%">${bubble}${extras}</div>`;
  row.innerHTML = role==="user" ? inner+avatar : avatar+inner;
  wrap.appendChild(row);
  scrollBottom();
}

function showTyping(){
  const row=document.createElement("div");
  row.className="msg-row bot"; row.id="typing";
  row.innerHTML=`<div class="avatar bot">☕</div><div class="bubble bot typing"><span></span><span></span><span></span></div>`;
  document.getElementById("messages").appendChild(row);
  scrollBottom();
}
function hideTyping(){ document.getElementById("typing")?.remove(); }

async function send(text){
  text=(text||"").trim();
  if(!text||busy) return;
  busy=true; setSend(false);
  appendMsg("user",text);
  history.push({role:"user",content:text});
  document.getElementById("inp").value="";
  autoResize(document.getElementById("inp"));
  showTyping();
  try{
    const res = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:history, system:SYSTEM}),
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const reply = data.reply || "Something went wrong — please try again.";
    hideTyping();
    history.push({role:"assistant",content:reply});
    appendMsg("bot",reply);
  } catch(e){
    hideTyping();
    appendMsg("bot","Sorry, something went wrong. Please try again in a moment.\n\nError: "+e.message);
    console.error(e);
  }
  busy=false; setSend(true);
  document.getElementById("inp").focus();
}

function qs(t)           { send(t); }
function sendFromInput() { send(document.getElementById("inp").value); }
function handleKey(e)    { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendFromInput();} }
function autoResize(el)  { el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,140)+"px"; setSend(el.value.trim().length>0); }
function setSend(on)     { document.getElementById("sendBtn").disabled=!on; }
function scrollBottom()  { const m=document.getElementById("messages"); m.scrollTop=m.scrollHeight; }
function esc(s)          { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

renderWelcome();
document.getElementById("inp").focus();
</script>
</body>
</html>

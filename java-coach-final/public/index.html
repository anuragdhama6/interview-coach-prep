<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Java Interview Coach</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#060b14;--surf:#0f172a;--surf2:#1a1f2e;--brd:#1e293b;--brd2:#334155;--txt:#e2e8f0;--txt2:#94a3b8;--txt3:#64748b;--acc:#3b82f6;--acc2:#1d4ed8}
  body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .header{background:#0a0f1e;border-bottom:1px solid var(--brd);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  .hl{font-size:24px}.ht{font-size:15px;font-weight:700;color:#f1f5f9}.hs{font-size:11px;color:var(--txt3);margin-top:1px}
  .badge{background:#22c55e20;color:#4ade80;border:1px solid #22c55e44;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px;margin-left:auto}
  .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:blink 1.5s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .qbar{background:#0a0f1e;border-bottom:1px solid var(--brd);padding:8px 16px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0}
  .qbar::-webkit-scrollbar{display:none}
  .qbtn{background:var(--surf);border:1px solid var(--brd);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--txt2);cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s}
  .qbtn:hover{border-color:var(--acc);color:#60a5fa;background:var(--surf2)}
  .msgs{flex:1;overflow-y:auto;padding:24px 16px;scroll-behavior:smooth}
  .msgs::-webkit-scrollbar{width:4px}
  .msgs::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px}
  .row{display:flex;gap:10px;margin-bottom:18px;align-items:flex-start;max-width:860px;margin-left:auto;margin-right:auto;width:100%}
  .row.user{flex-direction:row-reverse}
  .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .av.bot{background:var(--surf2);border:1px solid var(--brd2)}.av.user{background:var(--acc)}
  .bbl{max-width:80%;padding:12px 16px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .bbl.bot{background:var(--surf);border:1px solid var(--brd);border-radius:4px 18px 18px 18px;color:var(--txt)}
  .bbl.user{background:var(--acc2);border-radius:18px 4px 18px 18px;color:#fff}
  .welcome{background:var(--surf);border:1px solid var(--brd);border-radius:16px;padding:24px;max-width:580px}
  .welcome h2{font-size:19px;font-weight:700;color:#f1f5f9;margin-bottom:8px}
  .welcome p{font-size:13px;color:var(--txt3);line-height:1.7;margin-bottom:18px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mchip{background:#0a0f1e;border:1px solid var(--brd);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .15s;text-align:left;font-family:inherit}
  .mchip:hover{border-color:var(--acc);background:var(--surf2)}
  .mci{font-size:18px;margin-bottom:4px}.mcl{font-size:12px;font-weight:600;color:#f1f5f9}.mcd{font-size:11px;color:var(--txt3);margin-top:2px;line-height:1.4}
  .scard{background:var(--surf);border-radius:12px;padding:14px 18px;margin-top:8px;max-width:500px;width:100%}
  .srow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .snum{font-size:26px;font-weight:700;font-family:monospace}
  .sbg{flex:1;height:6px;background:var(--brd2);border-radius:3px;overflow:hidden}
  .sbar{height:100%;border-radius:3px}.slbl{font-size:11px;color:var(--txt2)}
  .sfb{font-size:13px;color:#cbd5e1;line-height:1.6}
  .sfu{font-size:13px;color:#7dd3fc;margin-top:8px;padding-top:8px;border-top:1px solid var(--brd)}
  .typing{display:flex;gap:5px;padding:14px 18px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:pulse 1.2s ease-in-out infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .iarea{background:#0a0f1e;border-top:1px solid var(--brd);padding:12px 16px;flex-shrink:0}
  .iinner{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;background:var(--surf);border:1px solid var(--brd);border-radius:14px;padding:12px 16px;color:var(--txt);font-size:14px;font-family:inherit;resize:none;outline:none;line-height:1.6;transition:border-color .15s;max-height:140px}
  textarea:focus{border-color:var(--acc)}textarea::placeholder{color:var(--txt3)}
  .sbtn{width:44px;height:44px;background:var(--acc);border:none;border-radius:12px;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
  .sbtn:disabled{background:var(--brd);color:var(--txt3);cursor:default}
  .sbtn:not(:disabled):hover{background:#2563eb}
  .hint{max-width:860px;margin:6px auto 0;font-size:11px;color:var(--txt3);text-align:center}
</style>
</head>
<body>
<div class="header">
  <div class="hl">☕</div>
  <div><div class="ht">Java Interview Coach</div><div class="hs">Senior · Java · Spring Boot · Microservices</div></div>
  <div class="badge"><div class="dot"></div>Free · No signup</div>
</div>
<div class="qbar">
  <button class="qbtn" onclick="qs('Start a mock interview')">🎯 Mock Interview</button>
  <button class="qbtn" onclick="qs('Give me a medium Java coding challenge')">💻 Coding Challenge</button>
  <button class="qbtn" onclick="qs('Profile me for a senior Java interview')">👤 Profile Me</button>
  <button class="qbtn" onclick="qs('Explain @Transactional pitfalls in Spring Boot')">@Transactional</button>
  <button class="qbtn" onclick="qs('Explain Virtual Threads in Java 21')">Virtual Threads</button>
  <button class="qbtn" onclick="qs('Explain Circuit Breaker with Resilience4j')">Circuit Breaker</button>
  <button class="qbtn" onclick="qs('Explain the N+1 query problem in JPA')">N+1 Problem</button>
  <button class="qbtn" onclick="qs('Start a tradeoff debate Kafka vs REST')">⚖️ Tradeoff</button>
  <button class="qbtn" onclick="qs('I want to do a code review')">🔬 Code Review</button>
  <button class="qbtn" onclick="qs('Explain SAGA pattern vs 2PC')">SAGA vs 2PC</button>
  <button class="qbtn" onclick="qs('What can you help me with')">❓ Help</button>
</div>
<div class="msgs" id="msgs"></div>
<div class="iarea">
  <div class="iinner">
    <textarea id="inp" rows="1" placeholder="Ask anything — Java, Spring Boot, Microservices..." onkeydown="hk(event)" oninput="ar(this)"></textarea>
    <button class="sbtn" id="sbtn" onclick="sfi()" disabled>↑</button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for new line · Free · No login</div>
</div>
<script>
const SYS = `You are a senior Java/Spring Boot/Microservices engineer and technical interview coach helping lateral joiners prepare for client interviews. Be direct and production-focused.

You have these modes:
1. MOCK INTERVIEW - ask one question at a time, score every answer. After each answer output on its own line: {"type":"score","score":3,"max":5,"topic":"Spring Transactions","category":"Spring Boot","feedback":"Missed self-invocation proxy trap.","followup":"What happens when @Transactional calls another method in same class?"}

2. CODING CHALLENGE - give Easy/Medium/Hard Java problems. After submission output on its own line: {"type":"codeeval","difficulty":"Medium","topic":"Collections","overallScore":72,"dimensions":{"correctness":{"score":8,"max":10,"feedback":"Correct but misses null"},"testCoverage":{"score":6,"max":10,"feedback":"No edge case tests"},"codeQuality":{"score":7,"max":10,"feedback":"Methods too long"},"solidPrinciples":{"score":6,"max":10,"feedback":"SRP violated"},"designPatterns":{"score":5,"max":10,"feedback":"Use Strategy pattern"},"edgeCases":{"score":4,"max":10,"feedback":"Missing null and empty"},"timeComplexity":{"score":8,"max":10,"feedback":"O(n log n)"},"javaIdiomatic":{"score":7,"max":10,"feedback":"Use streams"}},"idealSolution":"// solution here","nextChallenge":"Thread-safe version"}

3. PROFILER - ask 5 questions one at a time, then output on its own line: {"type":"profile","level":"Senior","gaps":["Virtual threads","SAGA"],"plan":"Week 1: Java 17-21. Week 2: Spring Boot. Week 3: Microservices.","readiness":42}

4. CONCEPT DEEP-DIVE - explain: WHAT IT IS, HOW IT WORKS INTERNALLY, WHEN TO USE, TRAP QUESTION, PRODUCTION GOTCHA, FOLLOW-UP

5. CODE REVIEW - review pasted code for transaction issues, thread safety, N+1, resilience, SOLID

6. TRADEOFF DEBATE - present architecture choices, challenge user reasoning

Rules: Never give textbook answers without production context. Always follow up. Keep responses focused.`;

let hist=[], busy=false;

function rw(){
  const modes=[
    {i:"🎯",l:"Mock Interview",d:"Scored interview simulation",c:"Start a mock interview"},
    {i:"💻",l:"Coding Challenge",d:"8-dimension code evaluation",c:"Give me a medium Java coding challenge"},
    {i:"👤",l:"Profile Me",d:"Gap analysis + study plan",c:"Profile me for a senior Java interview"},
    {i:"🔍",l:"Concept Deep-Dive",d:"3-layer + production gotchas",c:"Explain @Transactional pitfalls in depth"},
    {i:"🔬",l:"Code Review",d:"Senior engineer review",c:"I want to do a code review"},
    {i:"⚖️",l:"Tradeoff Debate",d:"Argue architecture decisions",c:"Start a tradeoff debate"},
  ];
  const row=document.createElement("div");
  row.className="row";
  row.innerHTML=`<div class="av bot">☕</div><div style="flex:1;max-width:600px"><div class="welcome"><h2>👋 Java Interview Coach</h2><p>Senior-level prep for Java · Spring Boot · Microservices.<br>Free, no login — just start chatting.</p><div class="mgrid">${modes.map(m=>`<button class="mchip" onclick="qs('${m.c}')"><div class="mci">${m.i}</div><div class="mcl">${m.l}</div><div class="mcd">${m.d}</div></button>`).join("")}</div></div></div>`;
  document.getElementById("msgs").appendChild(row);
  sb();
}

function am(role, content){
  const wrap=document.getElementById("msgs");
  const row=document.createElement("div");
  row.className="row "+role;
  let text=content, sd=null, pd=null, cd=null, rd=null;
  if(role==="bot"){
    const tp=(rx)=>{const m=text.match(rx);if(m){try{const d=JSON.parse(m[0]);text=text.replace(m[0],"").trim();return d;}catch{}}return null;};
    cd=tp(/\{"type":"codeeval"[\s\S]*?\}(?=\s|$)/);
    sd=tp(/\{"type":"score"[\s\S]*?\}(?=\s|$)/);
    pd=tp(/\{"type":"profile"[\s\S]*?\}(?=\s|$)/);
    rd=tp(/\{"type":"codereview"[\s\S]*?\}(?=\s|$)/);
    if(rd&&!sd) sd={score:rd.score,max:rd.max,feedback:(rd.issues||[]).join(" · "),followup:null};
  }
  const av=`<div class="av ${role}">${role==="bot"?"☕":"👤"}</div>`;
  const bbl=text?`<div class="bbl ${role}">${e(text)}</div>`:"";
  let ex="";
  if(sd){
    const p=(sd.score/sd.max)*100,c=p>=80?"#22c55e":p>=60?"#f59e0b":"#ef4444",l=p>=80?"Strong":p>=60?"Decent":"Needs work";
    ex+=`<div class="scard" style="border:1px solid ${c}33"><div class="srow"><span class="snum" style="color:${c}">${sd.score}/${sd.max}</span><div class="sbg"><div class="sbar" style="width:${p}%;background:${c}"></div></div><span class="slbl">${l}</span></div><div class="sfb">${e(sd.feedback||"")}</div>${sd.followup?`<div class="sfu">↳ ${e(sd.followup)}</div>`:""}</div>`;
  }
  if(cd){
    const ov=cd.overallScore||0,oc=ov>=80?"#22c55e":ov>=60?"#f59e0b":"#ef4444",ol=ov>=80?"Excellent":ov>=60?"Good":ov>=40?"Needs Work":"Rewrite Needed";
    const dims={correctness:"✓ Correctness",testCoverage:"🧪 Tests",codeQuality:"✨ Quality",solidPrinciples:"🏗 SOLID",designPatterns:"🔷 Patterns",edgeCases:"⚡ Edge Cases",timeComplexity:"⏱ Complexity",javaIdiomatic:"☕ Idiomatic"};
    const dr=Object.entries(dims).map(([k,lb])=>{const d=cd.dimensions?.[k];if(!d)return"";const p=(d.score/d.max)*100,c=p>=80?"#22c55e":p>=60?"#f59e0b":"#ef4444";return`<div style="margin-bottom:9px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:3px"><span style="font-size:12px;color:#94a3b8;flex:1">${lb}</span><span style="font-size:12px;font-weight:600;color:${c}">${d.score}/${d.max}</span></div><div style="height:5px;background:#1e293b;border-radius:3px;overflow:hidden"><div style="width:${p}%;height:100%;background:${c};border-radius:3px"></div></div><div style="font-size:11px;color:#64748b;margin-top:3px">${e(d.feedback||"")}</div></div>`;}).join("");
    const r=26,ci=2*Math.PI*r;
    ex+=`<div style="background:#0f172a;border:1px solid ${oc}44;border-radius:14px;overflow:hidden;margin-top:8px;max-width:520px;width:100%"><div style="padding:16px 20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:16px"><div style="position:relative;width:64px;height:64px;flex-shrink:0"><svg viewBox="0 0 64 64" width="64" height="64" style="transform:rotate(-90deg)"><circle cx="32" cy="32" r="${r}" fill="none" stroke="#1e293b" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${oc}" stroke-width="7" stroke-dasharray="${ci*ov/100} ${ci}" stroke-linecap="round"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:${oc}">${ov}</div></div><div><div style="font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:6px">${ol}</div>${cd.difficulty?`<span style="background:#f59e0b20;color:#fbbf24;border:1px solid #f59e0b44;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600">${cd.difficulty}</span>`:""}</div></div><div style="padding:16px 20px">${dr}</div>${cd.idealSolution?`<div style="border-top:1px solid #1e293b;padding:14px 20px"><div style="font-size:12px;color:#4ade80;margin-bottom:8px;font-weight:600">✓ Ideal Solution</div><pre style="font-size:12px;color:#94a3b8;overflow-x:auto;line-height:1.6;white-space:pre-wrap;background:#060b14;padding:12px;border-radius:8px">${e(cd.idealSolution)}</pre></div>`:""} ${cd.nextChallenge?`<div style="border-top:1px solid #1e293b;padding:10px 20px;background:#0a0f1e"><span style="font-size:12px;color:#475569">Next: </span><span style="font-size:12px;color:#7dd3fc">${e(cd.nextChallenge)}</span></div>`:""}</div>`;
  }
  if(pd){
    const gaps=(pd.gaps||[]).map(g=>`<span style="background:#ef444420;color:#fca5a5;padding:2px 10px;border-radius:20px;font-size:12px">${e(g)}</span>`).join(" ");
    const plan=(pd.plan||"").split(". ").filter(Boolean).map(l=>`<div style="display:flex;gap:8px;margin-bottom:4px"><span style="color:#3b82f6;flex-shrink:0">▸</span><span style="font-size:13px;color:#cbd5e1">${e(l)}</span></div>`).join("");
    ex+=`<div style="background:#1a1f2e;border:1px solid #3b82f633;border-radius:12px;padding:16px 20px;margin-top:8px;max-width:500px;width:100%"><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px"><span style="background:#3b82f620;color:#60a5fa;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:600">${e(pd.level||"")}</span><span style="background:#22c55e20;color:#4ade80;padding:3px 12px;border-radius:20px;font-size:13px">Readiness: ${pd.readiness||0}%</span></div><div style="font-size:11px;color:#64748b;margin-bottom:6px;text-transform:uppercase">Gaps</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${gaps}</div><div style="font-size:11px;color:#64748b;margin-bottom:6px;text-transform:uppercase">Study Plan</div>${plan}</div>`;
  }
  const inner=`<div style="display:flex;flex-direction:column;align-items:${role==="user"?"flex-end":"flex-start"};max-width:82%">${bbl}${ex}</div>`;
  row.innerHTML=role==="user"?inner+av:av+inner;
  wrap.appendChild(row);
  sb();
}

function st(){const r=document.createElement("div");r.className="row bot";r.id="typ";r.innerHTML=`<div class="av bot">☕</div><div class="bbl bot typing"><span></span><span></span><span></span></div>`;document.getElementById("msgs").appendChild(r);sb();}
function ht(){document.getElementById("typ")?.remove();}

async function send(text){
  text=(text||"").trim();
  if(!text||busy)return;
  busy=true;ss(false);
  am("user",text);
  hist.push({role:"user",content:text});
  document.getElementById("inp").value="";
  ar(document.getElementById("inp"));
  st();
  try{
    const res=await fetch("/.netlify/functions/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:hist,system:SYS}),
    });
    const txt=await res.text();
    let data;
    try{ data=JSON.parse(txt); }
    catch(pe){ throw new Error("Server returned invalid response: "+txt.substring(0,100)); }
    if(data.error) throw new Error(data.error);
    const reply=data.reply||"No response received";
    ht();
    hist.push({role:"assistant",content:reply});
    am("bot",reply);
  }catch(err){
    ht();
    am("bot","Error: "+err.message+"\n\nPlease check:\n1. GROQ_API_KEY is set in Netlify environment variables\n2. Netlify function is deployed (check Functions tab)");
    console.error(err);
  }
  busy=false;ss(true);
  document.getElementById("inp").focus();
}

function qs(t){send(t);}
function sfi(){send(document.getElementById("inp").value);}
function hk(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sfi();}}
function ar(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,140)+"px";ss(el.value.trim().length>0);}
function ss(on){document.getElementById("sbtn").disabled=!on;}
function sb(){const m=document.getElementById("msgs");m.scrollTop=m.scrollHeight;}
function e(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

rw();
document.getElementById("inp").focus();
</script>
</body>
</html>
